<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Saint Seiya RPG - Asgard Chapter</title>
    <link rel="stylesheet" href="engine/style.css" />
  </head>
  <body>
    <div id="wrapper">
      <div id="topbar">
        <span id="title">Saint Seiya RPG - Asgard Chapter</span>
        <span id="topbar-right">
          <button id="btn-lang" class="bar-btn" title="Language / Idioma">EN</button>
          <button id="btn-fullscreen" class="bar-btn" title="Fullscreen">⛶</button>
        </span>
      </div>
      <div id="stage">
        <canvas id="game" width="320" height="240"></canvas>
        <div id="overlay">
          <div id="loading">Loading…</div>
        </div>
      </div>
      <div id="controller">
        <div id="dpad">
          <button class="ctrl-btn" data-key="up">▲</button>
          <div class="dpad-row">
            <button class="ctrl-btn" data-key="left">◄</button>
            <button class="ctrl-btn" data-key="down">▼</button>
            <button class="ctrl-btn" data-key="right">►</button>
          </div>
        </div>
        <div id="action-pad">
          <button class="ctrl-btn act" data-key="cancel">X</button>
          <button class="ctrl-btn act" data-key="ok">Z</button>
        </div>
      </div>
      <div id="help"></div>
    </div>

    <!-- this game's settings and English terms, then the shared engine (engine/boot.js loads engine/js/*) -->
    <script src="game/config.js"></script>
    <script src="game/terms.js"></script>
    <script src="engine/boot.js"></script>
  </body>
</html>
